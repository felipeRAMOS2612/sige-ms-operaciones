services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: sige-oracle
    ports:
      - '1521:1521'
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: sige
      APP_USER_PASSWORD: sige
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  oracle-data:
